<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JA">
  <!--
    Favicon: JA monogram on the site's own palette (#030407 ground, warm
    #ff8a3d key). Drawn as geometry rather than text so it renders identically
    everywhere — a <text> favicon depends on fonts the browser may not have,
    and at 16px a missing font degrades to an unreadable box.
  -->
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9b4"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff6a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#1b2233"/>
      <stop offset="1" stop-color="#030407"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- J: stem with a hooked foot -->
  <path d="M30.5 15.5 V37.5 a8.5 8.5 0 0 1 -8.5 8.5 h-1.5"
        fill="none" stroke="url(#warm)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A: apex and legs, crossbar kept low so it stays open at 16px -->
  <path d="M35.5 46.5 L42.5 17.5 L49.5 46.5" fill="none" stroke="#f8f5f0"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38.6 36.5 H46.4" stroke="#f8f5f0" stroke-width="4.6"
        stroke-linecap="round"/>
</svg>
